[project]
name = "bank-platform"
version = "0.1.0"
description = "A multi-agent banking assistant: a LangGraph supervisor routes chat requests to specialist agents, backed by a full deterministic FastAPI/Postgres REST API."
readme = "README.md"
authors = [{ name = "Atharva Dharmadhikari" }]
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-supervisor>=0.0.31",
    "openai>=3.13.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
]

[project.urls]
Repository = "https://github.com/Atharva01/bank-platform"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_platform"]
